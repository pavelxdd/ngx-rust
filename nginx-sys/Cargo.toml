[package]
name = "nginx-sys"
version = "0.5.0"
categories = ["external-ffi-bindings"]
description = "FFI bindings to NGINX"
keywords = ["nginx", "ffi", "sys"]
build = "build/main.rs"
# This field is required to export DEP_NGINX_ vars
# See https://github.com/rust-lang/cargo/issues/3544
links = "nginx"
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true

[package.metadata.docs.rs]
all-features = true
default-target = "x86_64-unknown-linux-gnu"
targets = []

[dependencies]

[dev-dependencies]
dunce = "1.0.5"
shlex = "2.0.1"
tempfile = { version = "3.27.0", default-features = false }

[target.'cfg(not(windows))'.dependencies]
errno = { version = "0.3.14", default-features = false }

[build-dependencies]
bindgen = "0.72.1"
cc = "1.4.0"
dunce = "1.0.5"
regex = "1.13.1"
nginx-src = { version = "~1.30.0", optional = true, path = "../nginx-src" }
shlex = "2.0.1"

[features]
default = ["http"]
# Allows generation of bindings for the HTTP module.
http = []
# Allows generation of bindings for the Mail module.
mail = []
# Allows generation of bindings for the Stream module.
stream = []
# Builds a static NGINX library for unit-test executables.
test-link = []
# Enables downloading and building a copy of NGINX in the build script.
vendored = ["dep:nginx-src"]

[lints]
workspace = true
